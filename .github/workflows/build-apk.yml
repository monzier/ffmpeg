
name: Build TubeStitch APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project ZIP exists
        shell: bash
        run: |
          if [ ! -f "TubeStitch_Android_Project.zip" ]; then
            echo "ERROR: TubeStitch_Android_Project.zip was not found."
            echo "Upload the ZIP to the repository root."
            exit 1
          fi

      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p extracted-project
          unzip -o TubeStitch_Android_Project.zip -d extracted-project

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          SETTINGS_FILE=$(find extracted-project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No settings.gradle or settings.gradle.kts found."
            echo "Check the contents of the uploaded ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Android project at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TubeStitch-debug-apk
          path: extracted-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
